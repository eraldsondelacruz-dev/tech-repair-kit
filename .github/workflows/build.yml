name: build

on:
  push:
    branches: [main, dev]
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || { echo "FATAL: sdkmanager missing at $SDKM"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          echo "Reinstalling platforms;android-35 (runner ships a corrupt android.jar)"
          "$SDKM" --uninstall "platforms;android-35" > /dev/null 2>&1 || true
          yes | "$SDKM" "platforms;android-35" > /dev/null
          unzip -t "$ANDROID_HOME/platforms/android-35/android.jar" > /dev/null \
            && echo "android.jar integrity OK" \
            || { echo "FATAL: android.jar STILL corrupt"; ls -la "$ANDROID_HOME/platforms/android-35/"; exit 1; }

      - name: Build APK
        run: |
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          set -o pipefail
          sh ./gradlew --version 2>&1 | tail -10
          sh ./gradlew assembleDebug --stacktrace 2>&1 | tee ci-gradle.log || { tail -n 80 ci-gradle.log; echo "::error title=GradleCauses::$(grep -aE '^\* What went wrong|^Caused by|^Reason:|^Execution failed|Specification|configuration file|Could not|Failed to|> Task.*(FAILED|failed)' ci-gradle.log | tail -n 25 | base64 -w 0 | head -c 3500)"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  telegram:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: .

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Secrets not configured — skipping Telegram publish."
            exit 0
          fi
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@app-debug.apk \
            -F caption="Tech Repair Kit ${GITHUB_REF#refs/tags/} — debug APK (bootloader workstation: fastbot flasher + EDL firehose + readback)"
