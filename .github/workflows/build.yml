name: build

on:
  push:
    branches: [main, dev]
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || { echo "FATAL: sdkmanager missing at $SDKM"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          echo "Reinstalling platforms;android-34 (google's android-35 artifact is broken)"
          "$SDKM" --uninstall "platforms;android-34" > /dev/null 2>&1 || true
          yes | "$SDKM" "platforms;android-34" > /dev/null
          unzip -t "$ANDROID_HOME/platforms/android-34/android.jar" > /dev/null \
            && echo "android.jar integrity OK" \
            || { echo "FATAL: android.jar STILL corrupt"; ls -la "$ANDROID_HOME/platforms/android-34/"; exit 1; }

      - name: Build APK
        run: |
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          set -o pipefail
          sh ./gradlew --version 2>&1 | tail -10
          sh ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ci-gradle.log || { tail -n 120 ci-gradle.log; echo "::error title=GradleCauses::$(grep -aE '^\* What went wrong|^Caused by|^Reason:|^Execution failed|Specification|configuration file|Could not|Failed to|FAILED|error:|Out of memory|BUILD FAILED' ci-gradle.log | tail -n 30 | base64 -w 0 | head -c 3500)"; exit 1; }
          cp schematics/build/outputs/apk/debug/app-debug.apk schematics-debug.apk
          echo "schematics APK: $(ls -la schematics-debug.apk | awk '{print $5}') bytes"

      - name: Upload APK artifact (Repair Kit)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact (Board View)
        uses: actions/upload-artifact@v4
        with:
          name: schematics-debug
          path: ./schematics-debug.apk

  telegram:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: schematics-debug
          path: .

      - name: Secret X-ray
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KIT }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT }}
        run: |
          S="tok=$([ -n "$TELEGRAM_BOT_TOKEN" ] && echo yes || echo NO) chat=$([ -n "$TELEGRAM_CHAT_ID" ] && echo yes || echo NO)"
          echo "::notice title=SecretXray-b64::$(printf '%s' "$S" | base64 -w 0)"

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KIT }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice title=TelegramResp-b64::$(printf 'missing-secrets' | base64 -w 0)"
            echo "Secrets not configured — skipping Telegram publish."
            exit 0
          fi
          for f in app-debug.apk schematics-debug.apk; do
            case "$f" in
              app-debug.apk)
                CAP="Tech Repair Kit ${GITHUB_REF#refs/tags/} — bootloader workstation: fastboot flasher + EDL firehose + readback + FRP clear + UNLOCK BL";;
              schematics-debug.apk)
                CAP="Tatskie Board View ${GITHUB_REF#refs/tags/} — schematic viewer: pinch-zoom bitmap + PDF pages + bookmarks + dim slider";;
            esac
            RESP=$(curl -sS --max-time 120 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@$f \
              -F caption="$CAP")
            echo "::notice title=TelegramResp-$f-b64::$(printf '%s' "$RESP" | base64 -w 0)"
            if printf '%s' "$RESP" | grep -q '"ok":true'; then
              echo "$f delivered OK."
            else
              echo "Telegram API rejected $f — see TelegramResp-$f-b64 annotation."
              exit 1
            fi
          done
